name: Smoke test cache steps
description: Cache smoke test binaries
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Download compiled binary artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: k0sctl
        path: .

    - name: k0sctl cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        key: k0sctl-cache
        path: |
          /var/cache/k0sctl/k0s
          ~/.cache/k0sctl/k0s
    
    - name: kubectl cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: |
          smoke-test/kubectl
        key: "kubectl-${{ hashFiles('smoke-test/smoke.common.sh') }}"

    - name: Make binaries executable
      shell: bash
      run: |
        chmod +x k0sctl || true
        chmod +x smoke-test/kubectl || true

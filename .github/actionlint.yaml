# smoke-triage.lock.yml is generated by `gh aw compile` from smoke-triage.md —
# edit the markdown, never the lock file. actionlint flags things in the
# generated output that are not defects:
#   - `copilot-requests`, the permission scope that lets the Copilot CLI
#     authenticate with the built-in GITHUB_TOKEN, is missing from actionlint's
#     hardcoded scope list.
#   - `concurrency.queue` and `job.workflow_ref` are newer Actions features
#     actionlint does not know.
#   - two shellcheck nits inside gh-aw's own generated shell.
# Drop entries as actionlint catches up.
paths:
  .github/workflows/smoke-triage.lock.yml:
    ignore:
      - 'unknown permission scope "copilot-requests"'
      - 'unexpected key "queue" for "concurrency" section'
      - 'property "workflow_ref" is not defined'
      - 'SC1090'
      - 'SC2230'

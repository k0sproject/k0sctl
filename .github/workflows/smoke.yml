name: Smoke tests

on: 
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/smoke.yml
      - smoke-test/**

jobs:

  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Build
      run: make k0sctl

    - name: Stash the compiled binary for further testing
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: k0sctl
        path: k0sctl
        retention-days: 2

  smoke-basic:
    strategy:
      fail-fast: false
      matrix:
        # Latest and previous release of each distro family that bootloose
        # ships images for. See the "Choosing the OS image to run" section of
        # https://github.com/k0sproject/bootloose for the current image list.
        image:
          - quay.io/k0sproject/bootloose-alpine3.23:latest
          - quay.io/k0sproject/bootloose-alpine3.22:latest
          - quay.io/k0sproject/bootloose-amazonlinux2023:latest
          - quay.io/k0sproject/bootloose-debian13:latest
          - quay.io/k0sproject/bootloose-debian12:latest
          - quay.io/k0sproject/bootloose-fedora42:latest
          - quay.io/k0sproject/bootloose-rockylinux9:latest
          - quay.io/k0sproject/bootloose-ubuntu26.04:latest
          - quay.io/k0sproject/bootloose-ubuntu24.04:latest
    name: Basic 1+1 smoke
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-basic
  
  smoke-basic-rootless:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-debian13:latest
          - quay.io/k0sproject/bootloose-ubuntu26.04:latest
    name: Basic 1+1 smoke (regular user login)
    needs: build
    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-basic-rootless
  
  smoke-basic-idlike:
    name: Basic 1+1 smoke (ID_LIKE fallback)
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache

      - name: Build image
        run: |
          make -C smoke-test kalilinux.iid
          echo "LINUX_IMAGE=$(cat smoke-test/kalilinux.iid)" >> "$GITHUB_ENV"

      - name: Run smoke tests
        run: make smoke-basic
  
  smoke-basic-openssh:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-alpine3.23:latest
    name: Basic 1+1 smoke using openssh client
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-basic-openssh
  
  smoke-multidoc:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-alpine3.23:latest
    name: Basic 1+1 smoke using multidoc yamls
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-multidoc

  smoke-files:
    strategy:
      matrix:
        # Debian family only: smoke-files.sh installs `tree` with apt-get and
        # creates its test user with useradd, neither of which Alpine has.
        image:
          - quay.io/k0sproject/bootloose-ubuntu26.04:latest
          - quay.io/k0sproject/bootloose-debian13:latest
    name: Basic file upload smoke
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-files

  smoke-dynamic:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-alpine3.23:latest
    name: Basic dynamic config smoke
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-dynamic

  smoke-os-override:
    name: OS override smoke test
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run OS override smoke test
        run: make smoke-os-override

  smoke-downloadurl:
    name: k0sDownloadURL smoke test
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run k0sDownloadURL smoke test
        run: make smoke-downloadurl

  smoke-upgrade:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-alpine3.23:latest
          - quay.io/k0sproject/bootloose-amazonlinux2023:latest
          - quay.io/k0sproject/bootloose-rockylinux9:latest
          - quay.io/k0sproject/bootloose-ubuntu26.04:latest
        k0s_from:
          - v1.21.6+k0s.0
    name: Upgrade
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
          K0S_FROM:  ${{ matrix.k0s_from }}
        run: make smoke-upgrade
  
  smoke-dryrun:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-alpine3.23:latest
          - quay.io/k0sproject/bootloose-ubuntu26.04:latest
        k0s_from:
          - v1.21.6+k0s.0
    name: Dry run
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
          K0S_FROM:  ${{ matrix.k0s_from }}
        run: make smoke-dryrun

  smoke-reset:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-rockylinux9:latest
          - quay.io/k0sproject/bootloose-ubuntu26.04:latest

    name: Apply + reset
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-reset

  smoke-backup-restore:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-alpine3.23:latest
          - quay.io/k0sproject/bootloose-rockylinux9:latest
          - quay.io/k0sproject/bootloose-ubuntu26.04:latest

    name: Apply + backup + reset + restore
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-backup-restore
  
  smoke-backup-restore-out:
    name: Apply + backup + reset + restore (non-default output)
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          OUT: localfile
        run: make smoke-backup-restore
  
  smoke-controller-swap:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-alpine3.23:latest

    name: Controller swap
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-controller-swap
  
  smoke-reinstall:
    strategy:
      matrix:
        image:
          - quay.io/k0sproject/bootloose-alpine3.23:latest
          - quay.io/k0sproject/bootloose-ubuntu26.04:latest

    name: Reinstall (modify install flags)
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run smoke tests
        env:
          LINUX_IMAGE: ${{ matrix.image }}
        run: make smoke-reinstall

  smoke-init:
    name: Init sub-command smoke test
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smoke-test-cache
      - name: Run init smoke test
        run: make smoke-init


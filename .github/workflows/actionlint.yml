name: Lint (actionlint)
on:
  pull_request:
    paths:
      - .github/**

permissions:
  contents: read
  # reviewdog's default reporter is github-pr-check, which posts a check run
  checks: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@6a9ff88b9bb9c12ff3d7340e267f0f59effaa7cd # v1.80.1
        with:
          fail_on_error: true
          level: warning
          github_token: ${{ github.token }}

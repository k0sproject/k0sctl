version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Dependabot applies a 3 day cooldown to version updates by default. Spell
    # out a shorter one and let rig through immediately, as rig releases are
    # usually cut with a k0sctl bump already in mind.
    cooldown:
      default-days: 2
      exclude:
        - "github.com/k0sproject/rig/v2"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    # The codeql-action sub-actions (init, autobuild, analyze) must be on the
    # same version, so bump them together in a single PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    # gh-aw lock files are generated, and the gh-aw runtime they pin has to
    # match the compiler that generated them: bumping github/gh-aw-actions/setup
    # past v0.91.10 without recompiling broke every comment with "Missing or
    # invalid safe-output execution provenance". Update them by recompiling
    # with a newer gh-aw (`gh aw compile`), never by bumping actions in place.
    exclude-paths:
      - .github/workflows/*.lock.yml

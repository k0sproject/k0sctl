version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Dependabot applies a 3 day cooldown to version updates by default. Spell
    # out a shorter one and let rig through immediately, as rig releases are
    # usually cut with a k0sctl bump already in mind.
    cooldown:
      default-days: 2
      exclude:
        - "github.com/k0sproject/rig/v2"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    # The codeql-action sub-actions (init, autobuild, analyze) must be on the
    # same version, so bump them together in a single PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    # The gh-aw setup action is pinned in compiled .lock.yml files and must stay
    # on the version of the compiler that produced them. Bumping only the pin
    # pairs old compiled steps with newer setup scripts, so upgrade with
    # `gh extension upgrade aw && gh aw compile` instead.
    ignore:
      - dependency-name: "github/gh-aw-actions/*"
